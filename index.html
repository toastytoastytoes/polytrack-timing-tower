<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0d10">
<title>Polytrack • Timing Tower</title>
<style>
:root{--bg:#090c0f;--panel:#11171b;--panel2:#151d21;--line:#273238;--text:#eef5f2;--muted:#91a09c;--lime:#c8ff3d;--lime2:#91d90d;--red:#ff6868;--cyan:#6de5df;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 78% -10%,#23311c 0,transparent 35%),var(--bg);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.shell{max-width:1400px;margin:auto;padding:22px clamp(14px,3vw,38px) 48px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:8px 0 22px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:-.04em;font-size:20px}.brand-mark{width:40px;height:40px;border-radius:12px;background:var(--lime);color:#10150a;display:grid;place-items:center;font-weight:1000;font-size:22px;transform:skew(-7deg)}.brand small{display:block;font-size:10px;letter-spacing:.19em;color:var(--muted);font-weight:800;margin-top:1px}
.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 12px #c8ff3d77}
.nav{display:flex;gap:7px;overflow:auto;padding:18px 0}.nav button{border:1px solid transparent;background:transparent;color:var(--muted);padding:10px 15px;border-radius:11px;white-space:nowrap;font-weight:750}.nav button.active{background:#c8ff3d14;border-color:#c8ff3d45;color:var(--lime)}.nav button:hover{color:var(--text)}
.hero{display:grid;grid-template-columns:1.5fr .8fr;gap:16px;margin:6px 0 18px}.hero-main{background:linear-gradient(115deg,#1b2817,#141b1a 64%,#182329);border:1px solid #34442b;border-radius:24px;padding:clamp(22px,4vw,38px);position:relative;overflow:hidden;min-height:240px}.hero-main:after{content:"P";position:absolute;right:20px;bottom:-88px;font-size:300px;line-height:1;font-weight:1000;color:#c8ff3d08;pointer-events:none}.eyebrow{color:var(--lime);font-size:11px;font-weight:900;letter-spacing:.2em;text-transform:uppercase}.hero h1{font-size:clamp(34px,5vw,62px);letter-spacing:-.065em;line-height:.98;margin:13px 0 14px;max-width:650px}.hero p{color:#b7c5bd;max-width:490px;margin:0}.hero-side{display:grid;grid-template-rows:1fr 1fr;gap:16px}.mini-stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px}.mini-stat label,.stat label{color:var(--muted);font-size:11px;font-weight:850;letter-spacing:.13em;text-transform:uppercase;display:block}.mini-stat strong{display:block;font-size:32px;letter-spacing:-.04em;margin:5px 0}.mini-stat span{color:var(--muted);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}.stat{padding:17px 19px;background:#101619;border:1px solid var(--line);border-radius:15px}.stat strong{font-size:27px;display:block;letter-spacing:-.05em;margin-top:4px}.stat em{font-style:normal;color:var(--lime);font-size:11px;font-weight:800}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:26px 0 13px}.section-head h2{margin:0;font-size:23px;letter-spacing:-.04em}.section-head p{margin:4px 0 0;color:var(--muted);font-size:13px}.tools{display:flex;gap:8px;flex-wrap:wrap}.field{background:#0c1114;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}.field::placeholder{color:#677772}.btn{border:1px solid var(--line);background:#1b2428;color:var(--text);padding:10px 14px;border-radius:11px;font-weight:800}.btn:hover{border-color:#6a7b73}.btn.primary{background:var(--lime);border-color:var(--lime);color:#14190c}.btn.ghost{background:transparent}.btn.danger{color:var(--red)}.btn.small{padding:6px 9px;font-size:12px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:15px;background:var(--panel)}table{border-collapse:collapse;width:100%;min-width:690px}th,td{padding:13px 15px;text-align:left;border-bottom:1px solid #222c30}th{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);background:#141b1f;position:sticky;top:0}tr:last-child td{border-bottom:0}tbody tr:hover{background:#ffffff04}.trackname{font-weight:850}.series-tag{display:inline-block;color:var(--muted);font-size:10px;border:1px solid #344147;border-radius:6px;padding:3px 6px;margin-left:7px;font-weight:800}.time{font-variant-numeric:tabular-nums;font-weight:700}.best{color:var(--lime);font-weight:900}.empty{color:#63716d}.holder{display:flex;align-items:center;gap:7px;font-weight:750}.avatar{width:27px;height:27px;border-radius:8px;display:grid;place-items:center;background:#27332a;color:var(--lime);font-size:11px;font-weight:900}
.driver-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.driver-card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:20px}.driver-top{display:flex;justify-content:space-between;align-items:center}.big-avatar{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:#c8ff3d16;color:var(--lime);font-size:17px;font-weight:950;border:1px solid #c8ff3d30}.driver-card h3{margin:13px 0 2px;font-size:19px}.driver-card p{margin:0;color:var(--muted);font-size:12px}.driver-number{font-size:27px;font-weight:950;margin-top:17px;letter-spacing:-.04em}.driver-number small{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:0}.bar{height:5px;background:#273136;border-radius:10px;overflow:hidden;margin-top:10px}.bar span{height:100%;display:block;background:var(--lime);border-radius:10px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.form-field{display:flex;flex-direction:column;gap:7px}.form-field label{font-size:12px;font-weight:800;color:#b9c7c0}.form-field.full{grid-column:1/-1}.help{font-size:12px;color:var(--muted)}.notice{padding:13px 15px;background:#c8ff3d0b;border:1px solid #c8ff3d2e;color:#c6d7c7;border-radius:12px;font-size:13px;margin-bottom:15px}.notice strong{color:var(--lime)}.pill{display:inline-block;padding:4px 8px;border-radius:7px;background:#ffca6a16;color:#ffce76;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.pending-row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:15px 0;border-bottom:1px solid var(--line)}.pending-row:last-child{border-bottom:0}.pending-row h4{margin:0 0 4px}.pending-row p{margin:0;color:var(--muted);font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}.empty-state{padding:35px;text-align:center;color:var(--muted)}.empty-state strong{display:block;color:var(--text);font-size:17px;margin-bottom:5px}
footer{border-top:1px solid var(--line);margin-top:35px;padding-top:18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#75847e;font-size:11px}.modal-backdrop{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-backdrop.open{display:flex}.modal{max-width:460px;width:100%;background:#12191d;border:1px solid #3b494c;border-radius:20px;padding:24px;box-shadow:0 30px 100px #0009}.modal h2{margin-top:0}.modal p{color:var(--muted);font-size:13px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--lime);color:#11170a;font-weight:850;padding:12px 17px;border-radius:12px;box-shadow:0 12px 40px #0008;transition:.22s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:850px){.hero{grid-template-columns:1fr}.hero-side{grid-template-columns:1fr 1fr;grid-template-rows:auto}.stats{grid-template-columns:repeat(2,1fr)}.driver-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.shell{padding:12px 12px 30px}.status{display:none}.hero-side{grid-template-columns:1fr 1fr}.mini-stat{padding:14px}.mini-stat strong{font-size:25px}.stats{gap:8px}.stat{padding:13px}.stat strong{font-size:23px}.driver-grid{grid-template-columns:1fr 1fr}.driver-card{padding:14px}.driver-card h3{font-size:16px}.form-grid{grid-template-columns:1fr}.form-field.full{grid-column:auto}.section-head{align-items:start;flex-direction:column}.hero-main{min-height:220px}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar"><div class="brand"><div class="brand-mark">P</div><div>POLYTRACK<small>TEAM TIMING TOWER</small></div></div><div class="status"><span class="dot"></span><span id="syncLabel">LOCAL PREVIEW · SAVES ON THIS DEVICE</span></div></header>
<nav class="nav" aria-label="Main navigation">
<button class="active" data-page="overview">Overview</button><button data-page="records">Track records</button><button data-page="drivers">Drivers</button><button data-page="submit">Submit a time</button><button data-page="review">Review queue <span id="pendingCount"></span></button>
</nav>
<main id="app"></main>
<footer><span>POLYTRACK TIMING TOWER · TEAM RECORDS</span><span>Prototype build 01 · Shared cloud sync not connected yet</span></footer>
</div>
<div class="modal-backdrop" id="modal"><div class="modal"><h2 id="modalTitle">Admin review</h2><p id="modalText">This prototype stores data in this browser only.</p><div class="form-field"><label for="adminCode">Local review code</label><input class="field" id="adminCode" type="password" placeholder="Enter review code"></div><div class="actions" style="margin-top:16px"><button class="btn primary" id="modalConfirm">Continue</button><button class="btn" id="modalCancel">Cancel</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const initialTracks = [{"id":"L1","name":"Track 1","series":"Legacy","times":{"Ryder":24.381,"Hunter":24.22,"Elijah":23.0,"Bastian":23.162}},{"id":"L2","name":"Track 2","series":"Legacy","times":{"Ryder":19.924,"Hunter":20.879,"Elijah":21.246,"Bastian":20.994}},{"id":"L3","name":"Track 3","series":"Legacy","times":{"Ryder":16.525,"Hunter":15.961,"Elijah":15.91,"Bastian":16.204}},{"id":"L4","name":"Track 4","series":"Legacy","times":{"Ryder":21.807,"Hunter":22.148,"Elijah":21.33}},{"id":"L5","name":"Track 5","series":"Legacy","times":{"Hunter":45.115,"Elijah":43.248,"Bastian":43.205}},{"id":"L6","name":"Track 6","series":"Legacy","times":{"Ryder":38.652,"Hunter":40.193,"Elijah":39.032,"Bastian":39.071}},{"id":"L7","name":"Track 7","series":"Legacy","times":{"Ryder":28.201,"Hunter":28.276,"Elijah":27.101,"Bastian":27.104}},{"id":"L8","name":"Track 8","series":"Legacy","times":{"Hunter":58.777,"Elijah":55.287,"Bastian":55.885}},{"id":"L9","name":"Track 9","series":"Legacy","times":{"Ryder":28.332,"Hunter":28.675,"Elijah":28.288,"Bastian":28.291}},{"id":"L10","name":"Track 10","series":"Legacy","times":{"Ryder":46.444,"Hunter":48.347,"Elijah":47.581,"Bastian":47.127}},{"id":"L11","name":"Track 11","series":"Legacy","times":{"Ryder":31.71,"Hunter":33.239,"Elijah":32.003,"Bastian":32.011}},{"id":"L12","name":"Track 12","series":"Legacy","times":{"Ryder":21.877,"Hunter":21.89,"Elijah":22.065,"Bastian":21.891}},{"id":"L13","name":"Track 13","series":"Legacy","times":{"Ryder":37.232,"Hunter":35.879,"Elijah":34.204,"Bastian":34.219}},{"id":"L14","name":"Formula 1.3","series":"Legacy","times":{"Ryder":10.462,"Hunter":9.258,"Elijah":9.991,"Bastian":14.413}},{"id":"L15","name":"Formula 1.4","series":"Legacy","times":{"Ryder":29.626,"Hunter":20.509,"Elijah":30.583,"Bastian":38.726}},{"id":"L16","name":"Formula 1.5","series":"Legacy","times":{"Hunter":34.372,"Elijah":18.343,"Bastian":19.784}},{"id":"L17","name":"Formula 1.6","series":"Legacy","times":{"Hunter":24.384,"Elijah":23.495,"Bastian":23.561}},{"id":"L18","name":"Formula 1.7","series":"Legacy","times":{"Hunter":160.371,"Elijah":153.583,"Bastian":120.78}},{"id":"C1","name":"Summer 1","series":"Current","times":{"Ryder":22.897,"Hunter":23.745,"Bastian":23.435}},{"id":"C2","name":"Summer 2","series":"Current","times":{"Hunter":15.961,"Elijah":16.384,"Bastian":16.242}},{"id":"C3","name":"Summer 3","series":"Current","times":{"Ryder":20.762,"Hunter":21.162,"Elijah":21.993,"Bastian":20.877}},{"id":"C4","name":"Summer 4","series":"Current","times":{"Ryder":39.049,"Hunter":39.858,"Bastian":36.98}},{"id":"C5","name":"Summer 5","series":"Current","times":{"Hunter":58.0,"Bastian":54.442}},{"id":"C6","name":"Summer 6","series":"Current","times":{"Hunter":43.344,"Bastian":41.223}},{"id":"C7","name":"Summer 7","series":"Current","times":{"Hunter":34.752,"Bastian":34.739}},{"id":"C8","name":"Winter 1","series":"Current","times":{"Ryder":18.085,"Hunter":18.596,"Bastian":17.661}},{"id":"C9","name":"Winter 2","series":"Current","times":{"Ryder":28.575,"Hunter":28.717,"Elijah":30.226,"Bastian":28.041}},{"id":"C10","name":"Winter 3","series":"Current","times":{"Hunter":42.32,"Elijah":66.482,"Bastian":39.801}},{"id":"C11","name":"Winter 4","series":"Current","times":{"Hunter":20.492,"Bastian":20.059}},{"id":"C12","name":"Winter 5","series":"Current","times":{"Ryder":18.946,"Hunter":19.215,"Bastian":19.13}},{"id":"C13","name":"Desert 1","series":"Current","times":{"Hunter":29.243,"Bastian":27.266}},{"id":"C14","name":"Desert 2","series":"Current","times":{"Hunter":32.592,"Elijah":41.8224,"Bastian":30.787}},{"id":"C15","name":"Desert 3","series":"Current","times":{"Ryder":21.398,"Hunter":21.628,"Bastian":21.242}},{"id":"C16","name":"Desert 4","series":"Current","times":{"Ryder":22.71,"Hunter":22.977,"Bastian":22.277}},{"id":"C17","name":"Desert 5","series":"Current","times":{"Ryder":31.006,"Hunter":31.17,"Bastian":30.654}}];
const drivers=["Ryder","Hunter","Elijah","Bastian"];
const storeKey="polytrack-timing-tower-v1";
let state;
try{state=JSON.parse(localStorage.getItem(storeKey))||null}catch(e){state=null}
if(!state)state={tracks:initialTracks.map(t=>({...t,times:{...t.times}})),submissions:[],approved:[],history:[]};
if(!state.tracks||!state.tracks.length)state.tracks=initialTracks;
let page="overview",searchTerm="",seriesFilter="All",sortMode="name",reviewAction=null;
function save(){localStorage.setItem(storeKey,JSON.stringify(state));updatePending()}
function fmt(t){return t==null||t===""?"—":Number(t).toFixed(3)+"s"}
function bestOf(track){let vals=Object.entries(track.times).filter(([,v])=>Number.isFinite(Number(v))&&v!==""&&v!=null).map(([name,time])=>({name,time:Number(time)}));vals.sort((a,b)=>a.time-b.time);return vals[0]||null}
function trackRows(){let rows=state.tracks.filter(t=>(seriesFilter==="All"||t.series===seriesFilter)&&t.name.toLowerCase().includes(searchTerm.toLowerCase()));if(sortMode==="fastest")rows.sort((a,b)=>(bestOf(a)?.time??Infinity)-(bestOf(b)?.time??Infinity));else if(sortMode==="records")rows.sort((a,b)=>Object.keys(b.times).length-Object.keys(a.times).length);else rows.sort((a,b)=>a.series.localeCompare(b.series)||a.name.localeCompare(b.name,undefined,{numeric:true}));return rows}
function totalTimes(){return state.tracks.reduce((n,t)=>n+Object.keys(t.times).filter(k=>Number.isFinite(Number(t.times[k]))).length,0)}
function recordCounts(){let out={};drivers.forEach(d=>out[d]=0);state.tracks.forEach(t=>{const b=bestOf(t);if(b)out[b.name]++});return out}
function stats(){const all=state.tracks.map(t=>({track:t,best:bestOf(t)})).filter(x=>x.best);const overall=all.slice().sort((a,b)=>a.best.time-b.best.time)[0];const counts=recordCounts();const top=drivers.slice().sort((a,b)=>counts[b]-counts[a])[0];return {overall,counts,top,trackCount:state.tracks.length,timeCount:totalTimes(),records:all.length}}
function timeTable(rows){return `<div class="table-wrap"><table><thead><tr><th>Track</th><th>Ryder</th><th>Hunter</th><th>Elijah</th><th>Bastian</th><th>Team record</th><th>Record holder</th></tr></thead><tbody>${rows.map(t=>{const b=bestOf(t);return `<tr><td><span class="trackname">${esc(t.name)}</span><span class="series-tag">${t.series}</span></td>${drivers.map(d=>`<td class="time ${b&&b.name===d?'best':''}">${fmt(t.times[d])}</td>`).join("")}<td class="time best">${b?fmt(b.time):"—"}</td><td>${b?`<div class="holder"><span class="avatar">${b.name[0]}</span>${b.name}</div>`:'<span class="empty">No time yet</span>'}</td></tr>`}).join("")}</tbody></table></div>`}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function overview(){const s=stats(),p=state.submissions.length;return `<section class="hero"><div class="hero-main"><div class="eyebrow">● &nbsp; Every millisecond counts</div><h1>THE TEAM'S<br>TIME ATTACK.</h1><p>One tower. Every track. All four drivers. Keep the bragging rights backed by the stopwatch.</p><div style="margin-top:23px;display:flex;gap:9px;flex-wrap:wrap"><button class="btn primary" onclick="setPage('records')">View track records ↗</button><button class="btn ghost" onclick="setPage('submit')">＋ Submit a time</button></div></div><div class="hero-side"><div class="mini-stat"><label>Fastest lap on the board</label><strong>${s.overall?fmt(s.overall.best.time):"—"}</strong><span>${s.overall?esc(s.overall.track.name)+" · "+esc(s.overall.best.name):"No approved times yet"}</span></div><div class="mini-stat"><label>Current record leader</label><strong>${s.top||"—"}</strong><span>${s.top?`${s.counts[s.top]} track records held`:"Records appear as times are added"}</span></div></div></section>
<div class="stats"><div class="stat"><label>Tracks logged</label><strong>${s.trackCount}</strong><em>18 legacy + 17 current</em></div><div class="stat"><label>Times on file</label><strong>${s.timeCount}</strong><em>Imported from your workbook</em></div><div class="stat"><label>Team records</label><strong>${s.records}</strong><em>Fastest recorded lap per track</em></div><div class="stat"><label>Awaiting review</label><strong>${state.submissions.length}</strong><em>${p?"Pending team approval":"Queue is clear"}</em></div></div>
<div class="section-head"><div><h2>Latest record board</h2><p>A quick look at the tracks and their current fastest times.</p></div><button class="btn" onclick="setPage('records')">All ${s.trackCount} tracks →</button></div>${timeTable(state.tracks.filter(t=>bestOf(t)).sort((a,b)=>bestOf(a).time-bestOf(b).time).slice(0,6))}
<div class="section-head"><div><h2>Drivers' championship</h2><p>Track-record count, not total number of laps.</p></div><button class="btn" onclick="setPage('drivers')">Driver stats →</button></div>${driverCards()}
<div class="notice" style="margin-top:18px"><strong>Prototype note:</strong> this version saves to the browser you're using. Cloud sync, secure team login, and real multi-device submissions will be connected after we confirm which hosting services work on school Chromebooks.</div>`}
function records(){return `<div class="section-head"><div><h2>Track records</h2><p>Fastest valid submitted time wins. Lower time is better.</p></div><div class="tools"><input class="field" id="trackSearch" placeholder="Search tracks…" value="${esc(searchTerm)}"><select class="field" id="seriesSelect"><option ${seriesFilter==="All"?"selected":""}>All</option><option ${seriesFilter==="Legacy"?"selected":""}>Legacy</option><option ${seriesFilter==="Current"?"selected":""}>Current</option></select><select class="field" id="sortSelect"><option value="name" ${sortMode==="name"?"selected":""}>Track order</option><option value="fastest" ${sortMode==="fastest"?"selected":""}>Fastest lap</option><option value="records" ${sortMode==="records"?"selected":""}>Most times</option></select></div></div><div id="recordsTable">${timeTable(trackRows())}</div><p class="help" style="margin-top:10px">Green times are the fastest on that track. Missing times are left blank, not counted as zero.</p>`}
function driverCards(){const s=stats(),max=Math.max(1,...Object.values(s.counts));return `<div class="driver-grid">${drivers.map((d,i)=>{let own=state.tracks.reduce((n,t)=>n+(bestOf(t)?.name===d?1:0),0);let entered=state.tracks.reduce((n,t)=>n+(t.times[d]!=null?1:0),0);return `<article class="driver-card"><div class="driver-top"><div class="big-avatar">${d[0]}</div><span class="series-tag">DRIVER 0${i+1}</span></div><h3>${d}</h3><p>${entered} track times recorded</p><div class="driver-number">${own} <small>track records</small></div><div class="bar"><span style="width:${own/max*100}%"></span></div></article>`}).join("")}</div>`}
function driversPage(){return `<div class="section-head"><div><h2>Driver standings</h2><p>Who currently holds the most track records?</p></div></div>${driverCards()}<div class="section-head"><div><h2>Records by driver</h2><p>Each track contributes one record to its fastest driver.</p></div></div><div class="table-wrap"><table style="min-width:400px"><thead><tr><th>Position</th><th>Driver</th><th>Track records</th><th>Times submitted / on file</th></tr></thead><tbody>${drivers.slice().sort((a,b)=>stats().counts[b]-stats().counts[a]).map((d,i)=>`<tr><td>${i===0?"🏆":`#${i+1}`}</td><td><div class="holder"><span class="avatar">${d[0]}</span>${d}</div></td><td class="best">${stats().counts[d]}</td><td>${state.tracks.reduce((n,t)=>n+(t.times[d]!=null?1:0),0)}</td></tr>`).join("")}</tbody></table></div>`}
function submitPage(){return `<div class="section-head"><div><h2>Submit a lap time</h2><p>Send a new time to the review queue before it becomes official.</p></div></div><div class="notice"><strong>Fair-play rule:</strong> submissions are pending until a reviewer approves them. For this local prototype, the approved time will update the record board on this browser only.</div><div class="panel"><form id="submitForm" class="form-grid"><div class="form-field"><label for="driver">Driver</label><select class="field" id="driver" required>${drivers.map(d=>`<option>${d}</option>`).join("")}</select></div><div class="form-field"><label for="track">Track</label><select class="field" id="track" required>${state.tracks.map(t=>`<option value="${t.id}">${t.series} · ${t.name}</option>`).join("")}</select></div><div class="form-field"><label for="time">Lap time (seconds)</label><input class="field" id="time" type="number" min="0.001" max="9999" step="0.001" placeholder="e.g. 22.417" required></div><div class="form-field"><label for="evidence">Evidence link (optional)</label><input class="field" id="evidence" type="url" placeholder="https://…"><span class="help">A screenshot/video link helps verify a record.</span></div><div class="form-field full"><label for="notes">Notes (optional)</label><input class="field" id="notes" placeholder="Anything reviewers should know?"></div><div class="form-field full"><button class="btn primary" type="submit">Send for review ↗</button></div></form></div>`}
function reviewPage(){return `<div class="section-head"><div><h2>Review queue</h2><p>Approve or reject proposed times before they become official.</p></div><button class="btn" onclick="showAdminInfo()">How review works</button></div><div class="notice"><strong>Local demo:</strong> this review screen is not protected by a real account yet. Do not treat the local review code as secure. Cloud authentication and permissions are a later setup step.</div><div class="panel">${state.submissions.length?state.submissions.map(s=>`<div class="pending-row"><div><span class="pill">Pending</span><h4 style="margin-top:7px">${esc(s.driver)} · ${esc(trackById(s.trackId)?.name||"Unknown track")} · ${fmt(s.time)}</h4><p>Submitted ${new Date(s.created).toLocaleString()}${s.notes?" · "+esc(s.notes):""}${s.evidence?` · <a href="${esc(s.evidence)}" target="_blank" rel="noopener" style="color:var(--cyan)">Evidence ↗</a>`:""}</p></div><div class="actions"><button class="btn primary small" onclick="approve('${s.id}')">Approve</button><button class="btn danger small" onclick="reject('${s.id}')">Reject</button></div></div>`).join(""):`<div class="empty-state"><strong>🏁 No pending times</strong>Submit a lap time and it will show up here for review.</div>`}</div>`}
function trackById(id){return state.tracks.find(t=>t.id===id)}
function updatePending(){const el=document.getElementById("pendingCount");if(el)el.textContent=state.submissions.length?`(${state.submissions.length})`:""}
function render(){const app=document.getElementById("app");app.innerHTML=page==="overview"?overview():page==="records"?records():page==="drivers"?driversPage():page==="submit"?submitPage():reviewPage();document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));updatePending();wirePage()}
function setPage(p){page=p;render();window.scrollTo({top:0,behavior:"smooth"})}
function wirePage(){if(page==="records"){document.getElementById("trackSearch").addEventListener("input",e=>{searchTerm=e.target.value;document.getElementById("recordsTable").innerHTML=timeTable(trackRows())});document.getElementById("seriesSelect").addEventListener("change",e=>{seriesFilter=e.target.value;document.getElementById("recordsTable").innerHTML=timeTable(trackRows())});document.getElementById("sortSelect").addEventListener("change",e=>{sortMode=e.target.value;document.getElementById("recordsTable").innerHTML=timeTable(trackRows())})}if(page==="submit"){document.getElementById("submitForm").addEventListener("submit",e=>{e.preventDefault();const time=Number(document.getElementById("time").value);if(!Number.isFinite(time)||time<=0)return toast("Enter a valid lap time.");const item={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),driver:document.getElementById("driver").value,trackId:document.getElementById("track").value,time,evidence:document.getElementById("evidence").value.trim(),notes:document.getElementById("notes").value.trim(),created:Date.now()};state.submissions.unshift(item);save();toast("Time sent to the review queue 🏁");setPage("review")})}}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>setPage(b.dataset.page)));
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)}
function approve(id){const s=state.submissions.find(x=>x.id===id);if(!s)return;const t=trackById(s.trackId);if(!t)return;const old=t.times[s.driver];if(old==null||s.time<Number(old)){t.times[s.driver]=s.time;toast(`Approved! ${s.driver}'s time is now on the board.`)}else{state.history.unshift({track:t.name,driver:s.driver,time:s.time,created:s.created,approved:Date.now(),note:"Approved, but existing personal time retained because it is faster."});toast("Approved for history, but the faster existing time stays on the board.")}state.approved.unshift({...s,approved:Date.now()});state.submissions=state.submissions.filter(x=>x.id!==id);save();render()}
function reject(id){state.submissions=state.submissions.filter(x=>x.id!==id);save();toast("Submission rejected.");render()}
function showAdminInfo(){document.getElementById("modalTitle").textContent="Prototype review mode";document.getElementById("modalText").textContent="There is no secure admin password in this prototype. Review actions are local-only until real authentication is connected.";document.getElementById("adminCode").style.display="none";document.getElementById("modalConfirm").textContent="Got it";document.getElementById("modal").classList.add("open")}
document.getElementById("modalCancel").addEventListener("click",()=>document.getElementById("modal").classList.remove("open"));document.getElementById("modalConfirm").addEventListener("click",()=>document.getElementById("modal").classList.remove("open"));
render();
</script>
</body></html>
